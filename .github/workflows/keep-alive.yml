name: Keep Alive

on:
  schedule:
    - cron: "0 9 * * *"    # todos los dias a las 09:00 UTC
  workflow_dispatch:         # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase (keeps the DB active)
        env:
          SUPABASE_URL: https://pskfhdscxuauqxsmfrjm.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: falta el secret SUPABASE_ANON_KEY."
            exit 1
          fi
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          echo "Respuesta: $(cat /tmp/resp.txt)"
          case "$code" in
            200|206) echo "Supabase consultado OK - la base queda activa." ;;
            401|403) echo "ERROR: anon key invalida (HTTP $code)."; exit 1 ;;
            *)       echo "ERROR: respuesta inesperada (HTTP $code)."; exit 1 ;;
          esac
